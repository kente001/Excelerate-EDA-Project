<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Excelerate EDA: Sign-ups and program applications on an online platform.">
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
  .disp{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;font-weight:700}
  .spin{transform-origin:1068px 140px;animation:spin 16s linear infinite}
  .rev{transform-origin:1068px 140px;animation:spin 10s linear infinite reverse}
  .bolt{animation:bolt 2.8s steps(1,end) infinite}
  .arc{opacity:0;animation:arc 2.8s steps(1,end) infinite}
  .arc.b{animation-delay:-1.3s}.arc.c{animation-delay:-2.1s}
  .pulse{stroke-dasharray:150 2750;animation:run 4.5s linear infinite}
  .rule{animation:rule 4.5s ease-in-out infinite}
  .surge{animation:surge 1.6s steps(1,end) infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bolt{0%,100%{opacity:.92}6%{opacity:.35}9%{opacity:1}44%{opacity:.9}47%{opacity:.5}50%{opacity:1}}
  @keyframes arc{0%,100%{opacity:0}5%{opacity:1}12%{opacity:0}46%{opacity:.9}52%{opacity:0}}
  @keyframes run{to{stroke-dashoffset:-2900}}
  @keyframes rule{0%,100%{width:60px}50%{width:260px}}
  @keyframes surge{0%,100%{opacity:.35}18%{opacity:.7}27%{opacity:.25}52%{opacity:.6}61%{opacity:.85}70%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5484d" stop-opacity=".16"/><stop offset=".55" stop-color="#0f1728" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e5484d"/></pattern>
  <linearGradient id="fade" x1="1" y1="0" x2=".45" y2=".9"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="m"><rect width="1200" height="280" fill="url(#fade)"/></mask>
  <clipPath id="clip"><path d="M19 14H1152a34 34 0 0 1 34 34V261a5 5 0 0 1 -5 5H48a34 34 0 0 1 -34 -34V19a5 5 0 0 1 5 -5z"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="halo" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>

<path class="surge" d="M19 14H1152a34 34 0 0 1 34 34V261a5 5 0 0 1 -5 5H48a34 34 0 0 1 -34 -34V19a5 5 0 0 1 5 -5z" fill="none" stroke="#e5484d" stroke-width="6" filter="url(#halo)"/>
<path d="M19 14H1152a34 34 0 0 1 34 34V261a5 5 0 0 1 -5 5H48a34 34 0 0 1 -34 -34V19a5 5 0 0 1 5 -5z" fill="#101829"/>
<g clip-path="url(#clip)">
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)" mask="url(#m)" opacity=".5"/>
  <rect class="rule" x="14" y="14" width="60" height="3" fill="#e5484d"/>
</g>
<path d="M19 14H1152a34 34 0 0 1 34 34V261a5 5 0 0 1 -5 5H48a34 34 0 0 1 -34 -34V19a5 5 0 0 1 5 -5z" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
<path class="pulse" d="M19 14H1152a34 34 0 0 1 34 34V261a5 5 0 0 1 -5 5H48a34 34 0 0 1 -34 -34V19a5 5 0 0 1 5 -5z" fill="none" stroke="#e5484d" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
<path d="M1174 232v22h-22" fill="none" stroke="#e5484d" stroke-opacity=".8"/>

<text class="mono" x="64" y="84" font-size="17" letter-spacing="3" fill="#e5484d">05 / EDA · PYTHON · LOOKER STUDIO</text>
<text class="disp" x="62" y="152" font-size="54" fill="#eef2f7" letter-spacing="-1">Excelerate EDA</text>
<text class="mono" x="64" y="198" font-size="19" fill="#9aa8ba">Sign-ups and program applications on an online platform.</text>
<text class="mono" x="64" y="238" font-size="13" letter-spacing="2" fill="#64738a">THE SILENT DATA // KENNEDY NJOROGE</text>

<g fill="none">
  <g class="spin" stroke="#e5484d">
    <circle cx="1068" cy="140" r="74" stroke-dasharray="4 12" stroke-width="1.5"/>
    <path d="M1068 58l7 8-7 8-7-8z" fill="#e5484d" stroke="none"/><path d="M1068 206l7 8-7 8-7-8z" fill="#e5484d" stroke="none"/>
    <path d="M986 140l8-7 8 7-8 7z" fill="#e5484d" stroke="none"/><path d="M1134 140l8-7 8 7-8 7z" fill="#e5484d" stroke="none"/>
  </g>
  <circle class="rev" cx="1068" cy="140" r="56" stroke="#3987e5" stroke-width="2.5" stroke-dasharray="48 20 10 20"/>
  <path d="M1068 98l36.4 21v42L1068 182l-36.4-21v-42z" stroke="#ffffff" stroke-opacity=".2"/>
  <g stroke="#eaf6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path class="arc" d="M1118 86l12-10 4 13 15-6"/>
    <path class="arc b" d="M1016 192l-13 6 2-15-15 2"/>
    <path class="arc c" d="M1010 96l-14-4 6-12-13-5"/>
  </g>
  <path class="bolt" d="M1079 96l-34 50h20l-7 38 34-52h-20z" fill="#e5484d" stroke="#fff3d6" stroke-width="1.5" filter="url(#glow)"/>
</g>
</svg>
